<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Consolas', 'Courier New', monospace; }
  </style>

  <!-- Browser chrome -->
  <rect width="900" height="560" rx="8" fill="#1a1a2e"/>
  <rect x="0" y="0" width="900" height="36" rx="8" fill="#16213e"/>
  <rect x="0" y="20" width="900" height="16" fill="#16213e"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <rect x="120" y="8" width="380" height="20" rx="10" fill="#0f3460"/>
  <text x="310" y="23" text-anchor="middle" fill="#8892b0" font-size="11">localhost:8000</text>

  <!-- Page title -->
  <text x="450" y="68" text-anchor="middle" fill="#ccd6f6" font-size="22" font-weight="bold">TimeLens</text>
  <text x="450" y="86" text-anchor="middle" fill="#8892b0" font-size="12">LLM Time-Series Analyst</text>

  <!-- Upload zone (completed state) -->
  <rect x="20" y="100" width="860" height="42" rx="6" fill="#0f3460" stroke="#64ffda" stroke-width="1"/>
  <text x="450" y="126" text-anchor="middle" fill="#64ffda" font-size="13">sample_nasa_temperature.csv  (1 460 rows · hourly · 1975-01-01 → 2022-12-31)</text>

  <!-- Chart area -->
  <rect x="20" y="152" width="860" height="220" rx="6" fill="#0d1b2a"/>
  <!-- Y axis label -->
  <text x="38" y="268" text-anchor="middle" fill="#8892b0" font-size="10" transform="rotate(-90,38,268)">Temperature (°C)</text>
  <!-- Chart line (simplified sine-like path) -->
  <polyline
    points="60,340 100,310 140,290 180,300 220,280 260,300 300,290 340,260 380,245 410,250 440,310 460,330 490,320 520,295 550,280 560,240 580,220 600,240 620,260 650,280 680,295 710,305 740,290 770,280 800,285 840,270 870,260"
    fill="none" stroke="#64ffda" stroke-width="2"/>
  <!-- Anomaly markers (red circles) -->
  <circle cx="380" cy="245" r="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <circle cx="410" cy="250" r="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <circle cx="560" cy="240" r="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <circle cx="580" cy="220" r="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <!-- X axis labels -->
  <text x="100" y="378" text-anchor="middle" fill="#8892b0" font-size="9">1980</text>
  <text x="250" y="378" text-anchor="middle" fill="#8892b0" font-size="9">1990</text>
  <text x="410" y="378" text-anchor="middle" fill="#8892b0" font-size="9">1997</text>
  <text x="560" y="378" text-anchor="middle" fill="#8892b0" font-size="9">2010</text>
  <text x="730" y="378" text-anchor="middle" fill="#8892b0" font-size="9">2020</text>
  <!-- Legend -->
  <line x1="720" y1="168" x2="740" y2="168" stroke="#64ffda" stroke-width="2"/>
  <text x="745" y="172" fill="#ccd6f6" font-size="10">temperature</text>
  <circle cx="730" cy="182" r="5" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <text x="745" y="186" fill="#ccd6f6" font-size="10">anomaly</text>

  <!-- Report section -->
  <rect x="20" y="382" width="860" height="158" rx="6" fill="#0f3460"/>
  <text x="38" y="402" fill="#64ffda" font-size="12" font-weight="bold">Analysis Report</text>

  <text x="38" y="422" fill="#a8b2d8" font-size="11" font-weight="bold">Trend Summary</text>
  <text x="38" y="438" fill="#ccd6f6" font-size="10">Global mean temperature shows a +0.18 °C/decade upward trend over the 47-year window. A sustained warm</text>
  <text x="38" y="452" fill="#ccd6f6" font-size="10">plateau is visible from 1997-1999 (El Niño) and again in 2015-2016, each coinciding with ENSO events.</text>

  <text x="38" y="472" fill="#a8b2d8" font-size="11" font-weight="bold">Anomalies (4 detected, Z-score &gt; 2.5)</text>
  <text x="38" y="488" fill="#ccd6f6" font-size="10">• 1997-11 — score 3.21 — Peak El Niño warming event; temperature 2.4 °C above seasonal baseline.</text>
  <text x="38" y="502" fill="#ccd6f6" font-size="10">• 2010-03 — score 2.87 — Rapid rebound following La Niña cool phase; unusually sharp month-on-month rise.</text>

  <text x="38" y="522" fill="#a8b2d8" font-size="11" font-weight="bold">Next Steps</text>
  <text x="38" y="538" fill="#ccd6f6" font-size="10">Cross-reference anomaly timestamps against ENSO index records; consider seasonal decomposition</text>
  <text x="38" y="552" fill="#ccd6f6" font-size="10">(STL) to isolate the anthropogenic trend from natural variability before further modelling.</text>
</svg>
